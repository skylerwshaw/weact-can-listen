; PlatformIO wrapper for TrooperDuper's CAN_CSV_WeAct_Listen.ino
; (github.com/TrooperDuper/espar-airtronic-esphome, arduino/). Listen-only
; TWAI at 500 kbit/s on the WeAct CAN485 V1 (RX GPIO26, TX GPIO27), prints
; SavvyCAN-format CSV at 115200 baud.
[env:weact]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem5C4C0524191
monitor_port = /dev/cu.usbmodem5C4C0524191
